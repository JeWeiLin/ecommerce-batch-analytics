# Trino Delta Lake connector reading the lakehouse written by Spark.
# docker-compose mounts ./data/lake at /lakehouse/lake (read-only) and
# ./data/trino-metastore at /lakehouse/metastore (Trino's table registry).
connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=local:///metastore
fs.native-local.enabled=true
local.location=/lakehouse
delta.register-table-procedure.enabled=true

# To read the lake from MinIO instead (Spark writing to s3a://lakehouse/lake), replace the
# file-system lines with:
#   fs.native-s3.enabled=true
#   s3.endpoint=http://minio:9000
#   s3.region=us-east-1
#   s3.path-style-access=true
#   s3.aws-access-key=minioadmin
#   s3.aws-secret-key=minioadmin
# and use s3://lakehouse/... locations in trino/register_tables.sh.
